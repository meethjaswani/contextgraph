[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextgraph"
version = "0.1.0"
description = "An MCP server that turns a codebase into a queryable graph, so coding agents fetch only the code they need."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Meeth Jaswani" }]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.4",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["httpx>=0.27"]

[project.scripts]
contextgraph = "contextgraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
